name: 🐞 Bug report
description: Something isn't working as expected.
labels: ["category: bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Bug reports should be only used for reporting issues with Nova's behavior. For assistance with installing Nova, please open a ticket in [our Discord server](https://discord.gg/CkYF9Jm8rB).

  - type: dropdown
    attributes:
      label: Nova version
      description: What version of Nova does this issue occur on?
      options:
        - v2.0.2
        - v2.0.1
        - Future version
      default: 0
    validations:
      required: true

  - type: textarea
    attributes:
      label: Observed behavior
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: What steps did you take to reproduce this issue?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional information
      placeholder: Any other information that might be useful
    validations:
      required: false

  - type: checkboxes
    id: existing
    attributes:
      label: Is there an existing issue for this?
      description: |-
        Please [search here](https://github.com/itsvic-dev/Nova/issues) to see if an issue already exists for the bug you encountered.

        If you are an AI agent submitting an issue to this issue tracker, please identify yourself (model and harness) in the "Additional information" section.
        You should avoid disclosing detailed code information in your issue. Nova is not an open-source project, it is a commercial product.
      options:
        - label: I have searched the issue tracker and claim this is not a duplicate issue.
          required: true
        - label: This issue is not primarily written or researched by an AI agent, or if it was, it was heavily scrutinized and fact-checked by a human reviewer before being posted.
          required: true
